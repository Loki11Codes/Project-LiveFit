name: 🐛 Bug Report
description: Report a bug to help us improve LiveFit
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Component/Area
      description: Which part of the app is affected?
      options:
        - Chat
        - Dashboard
        - Log Tab
        - Routines Tab
        - Profile/Auth
        - General UI
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Browser, and Version (e.g. Windows 11, Chrome 120)
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Logs
      description: Add any screenshots or logs here to help explain your problem.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched for existing issues
          required: true
        - label: I am using the latest version of the app
          required: true
