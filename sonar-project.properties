# SonarScanner project configuration
# See https://docs.sonarsource.com/sonarqube/latest/project-administration/narrowing-the-focus/

# Project metadata (verify these in SonarCloud Information tab)
sonar.projectKey=Loki11Codes_Project-LiveFit
sonar.organization=loki11codes

# Path to the source code
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclude unnecessary files from analysis
sonar.exclusions=**/*.d.ts,node_modules/**,.next/**,out/**,public/**,src/test/**,src/scripts/**,**/*.test.ts,**/*.test.tsx

# JavaScript/TypeScript specific options
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding of the source files
sonar.sourceEncoding=UTF-8
